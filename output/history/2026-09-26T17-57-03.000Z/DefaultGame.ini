+TextReplacements=(Category=Game, Namespace="", Key="9858F6FC4054C296821C97B0B3ABD6C6", NativeString="Level up equipped Sprites by eliminating players, opening containers, and extracting Sprites.", LocalizedStrings=(("ar","ارفع مستوى الأرواح المجهزة بالقضاء على اللاعبين وفتح الحاويات واستخدام رموز الغش واستخراج الأرواح."),("en","Level up equipped Sprites by eliminating players, opening containers, using cheat codes, and extracting Sprites."),("de","Verbessere ausgerüstete Geister, indem du Spieler eliminierst, Behälter öffnest, Cheat-Codes verwendest und Geister extrahierst."),("es","Mejora los espíritus equipados al eliminar jugadores, abrir contenedores, usar trucos y extraer más espíritus."),("es-419","Sube de nivel los espíritus equipados al eliminar jugadores, abrir contenedores, usar códigos de hackeo y extraer espíritus."),("fr","Améliorez les esprits équipés en éliminant des joueurs, en ouvrant des contenants, en utilisant des codes de déblocage et en extrayant des esprits."),("id","Naikkan level Sprite yang dipasang dengan menyingkirkan pemain, membuka wadah, menggunakan kode cheat, dan mengekstrak Sprite."),("it","Fai salire di livello gli spiritelli equipaggiati eliminando giocatori, aprendo contenitori, usando codici trucco ed estraendo spiritelli."),("ja","プレイヤーの撃破、コンテナの開封、チートコードの使用、精霊の抽出といったさまざまな手段で、装備中の精霊をレベルアップさせよう。"),("ko","플레이어를 처치하고, 컨테이너를 열고, 치트 코드를 사용하고, 정령을 회수하여 장착한 정령의 레벨을 올리세요."),("pl","Zwiększaj poziom wyposażonych Duszków przez likwidowanie graczy, otwieranie pojemników, używanie cheatów i dokonywanie ekstrakcji Duszków."),("pt-BR","Suba o nível dos Elementais equipados ao eliminar jogadores, abrir recipientes, usar códigos de trapaça e extrair mais Elementais."),("ru","Чтобы повышать уровень задействованных духов, устраняйте игроков, открывайте контейнеры, используйте чит-коды и эвакуируйте духов."),("th","อัปเลเวลสไปรต์ที่สวมใส่อยู่ด้วยการกำจัดผู้เล่น เปิดกล่องไอเทม ใช้สูตรโกง และสกัดสไปรต์"),("tr","Oyuncuları avlayarak, kutu açarak, hile kodları kullanarak ve Büyücük çıkararak kuşandığın Büyücüklerin seviyesini yükselt."),("vi","Tăng cấp Tinh Linh đã trang bị bằng cách hạ gục người chơi, mở thùng đồ, sử dụng mã gian lận và trích xuất Tinh Linh."),("zh-hans","通过淘汰玩家、打开容器、使用作弊码和回收精灵，可以提升已装备精灵的等级。"),("zh-Hant","透過淘汰玩家、開啟儲藏容器、使用作弊指令及回收精靈來升級已裝備的精靈。")))
+TextReplacements=(Category=Game, Namespace="", bIsMinimalPatch=True, Key="2937108146B80C60F4D2FCA7C3CB6E2A", NativeString="Each unique Sprite is permanently mastered when extracted at Max Level 5.", LocalizedStrings=(("ar","يتم إتقان كل روح فريدة بشكل دائم عند استخراجها عند المستوى الأقصى 5."),("de","Jeder verschiedene Geist wird dauerhaft gemeistert, wenn er auf dem maximalen Level (5) extrahiert wird."),("es","Cada espíritu se domina para siempre cuando se extrae en el nivel máximo (5)."),("es-419","Las maestrías que obtengas serán permanentes tras extraer espíritus en el nivel máximo (5)."),("fr","Chaque esprit unique est maîtrisé de façon permanente s'il est extrait au niveau maximal de 5."),("id","Setiap Sprite unik dikuasai secara permanen saat diekstrak di Level Maks 5."),("it","La maestria di ogni spiritello individuale si ottiene quando lo si estrae al livello massimo, il 5."),("ja","上限のレベル5で抽出することで、その精霊は永続的にマスタリー状態となる。"),("ko","각 고유 정령은 최고 레벨인 5레벨에서 회수할 때 영구적으로 마스터됩니다."),("pl","Każdy unikalny Duszek zostaje trwale okiełznany po ekstrakcji na poziomie 5."),("pt-BR","Cada Elemental único é dominado permanentemente ao ser extraído no Nível Máximo 5."),("ru","Развитие каждого отдельного духа считается завершённым, если эвакуировать его на максимальном, пятом уровне."),("th","ความชำนาญสไปรต์แต่ละตัวจะเพิ่มขึ้นถาวร เมื่อสกัดในเลเวลสูงสุดที่เลเวล 5"),("tr","Azami 5. seviyede çıkarılan her benzersiz Büyücük'te kalıcı olarak ustalaşılır."),("vi","Bạn có thể thông thạo vĩnh viễn các Tinh Linh đặc biệt khi trích xuất chúng ở Cấp 5 Tối Đa."),("zh-hans","每个独特的精灵在满级5级时被回收后，可获得永久精通。"),("zh-Hant","在精靈達到最高 5 級後進行回收，即可永久精通該精靈。")))
