+TextReplacements=(Category=Game, Namespace="", Key="1D1A68B94AC72A7BA52861ADEF7C23A2", NativeString="Emits a ping for players with rare sprites nearby, but marks you on the map. Ping radius increases at each Level Up: 40m -> 50m -> 60m -> 70m -> 80m ", LocalizedStrings=(("ar","تضع علامة على الأرواح النادرة بالجوار، وعلى الأعداء المتجهزين بمتغيرات الأرواح، لكن يُكشف عن موقعك. يزداد نطاق العلامة مع كل ارتفاع للمستوى: 25 مترًا -> 30 مترًا -> 40 مترًا -> 50 مترًا -> 60 مترًا"),("en","Marks rare Sprite Variants nearby, including enemies with Variants, but reveals your location. Ping radius increases at Level Up: 25m -> 30m -> 40m -> 50m -> 60m"),("de","Markiert seltene Geistervarianten in der Nähe, darunter auch Gegner, die Varianten haben – deine Position wird jedoch offenbart. Der Ping-Radius vergrößert sich mit jedem Levelaufstieg: 25 m -> 30 m -> 40 m -> 50 m -> 60 m."),("es","Marca variantes raras de espíritus cercanas, incluidos los enemigos con variantes. Eso sí, se revela tu ubicación. A medida que sube de nivel, el radio de la señal aumenta: 25 m -> 30 m -> 40 m -> 50 m -> 60 m"),("es-419","Marca variantes raras de espíritus cercanas, incluidos los enemigos con variantes, pero revela tu ubicación. El radio aumenta con cada subida de nivel: 25 m -> 30 m -> 40 m -> 50 m -> 60 m"),("fr","Indique les variantes d'esprits rares à proximité, y compris les ennemis dotés de variantes, mais révèle votre position. Le rayon de détection augmente à chaque gain de niveau : 25 m -> 30 m -> 40 m -> 50 m -> 60 m"),("id","Menandai Varian Sprite langka di sekitar, termasuk musuh dengan Varian, tetapi mengungkap lokasimu. Radius ping meningkat ketika Naik Level: 25m -> 30m -> 40m -> 50m -> 60m"),("it","Contrassegna le varianti rare degli spiritelli nelle vicinanze, compresi i nemici che le usano, ma rivela la tua posizione. Il raggio del ping aumenta a ogni aumento di livello: 25 m -> 30 m -> 40 m -> 50 m -> 60 m"),("ja","近くにいる珍しい精霊の変種(変種のある敵を含む)をマークするが、マップで自分の位置が公開されてしまう。レベルアップのたびにマーカーの範囲が拡大: 25メートル -> 30メートル -> 40メートル -> 50メートル -> 60メートル"),("ko","근처의 희귀 정령 변종(변종을 가진 적 포함)을 표시하지만, 내 위치가 노출됩니다. 레벨업 시 핑 반경 증가: 25m -> 30m -> 40m -> 50m -> 60m"),("pl","Namierza pobliskie rzadkie warianty Duszków, w tym wrogów z wariantami, ale ujawnia twoją pozycję. Promień pingu zwiększa się przy każdym awansie na nowy poziom: 25 m -> 30 m -> 40 m -> 50 m -> 60 m"),("pt-BR","Marca Variantes de Elementais raras por perto, incluindo inimigos com Variantes, mas revela sua localização. O raio do sinal aumenta a cada Subida de Nível: 25 m -> 30 m -> 40 m -> 50 m -> 60 m"),("ru","Отмечает редкие варианты духов поблизости, даже если они находятся у врагов, но при этом раскрывает ваше местоположение. С каждым новым уровнем радиус обнаружения увеличивается: 25 м ➝ 30 м ➝ 40 м ➝ 50 м ➝ 60 м"),("th","ทำเครื่องหมายสไปรต์รูปแบบหายากที่อยู่ใกล้เคียง รวมถึงศัตรูที่มีรูปแบบดังกล่าว แต่เปิดเผยตำแหน่งของคุณ รัศมีของเครื่องหมายจะเพิ่มขึ้นทุกครั้งที่เลเวลอัป: 25 ม. -> 30 ม. -> 40 ม. -> 50 ม. -> 60 ม."),("tr","Düşmanların sahip olduğu çeşitler de dahil yakındaki Nadir Büyücük çeşitlerini işaretler ama konumunu açığa çıkarır. Seviye atladığında işaretleme yarıçapı artar: 25 m -> 30 m -> 40 m -> 50 m -> 60 m"),("vi","Đánh dấu các biến thể Tinh Linh hiếm ở gần và kẻ địch sở hữu chúng, nhưng đổi lại, bạn sẽ bị lộ vị trí trên bản đồ. Bán kính báo hiệu tăng khi Lên Cấp: 25m -> 30m -> 40m -> 50m -> 60m"),("zh-hans","标记附近稀有精灵变体，包括带有变体的敌人，但会暴露你的位置。升级时，侦测半径会增加：25米 -> 30米 -> 40米 -> 50米 -> 60米"),("zh-Hant","標記附近的稀有精靈變體，包括帶有變體的敵人，但會揭露你的位置。升級時，偵測半徑提高：25 公尺 -> 30 公尺 -> 40 公尺 -> 50 公尺 -> 60 公尺"))) 
+TextReplacements=(Category=Game, Namespace="ST_SpriteBoons", Key="PAID_SpriteBoons_ChaosAura.ItemDescription", NativeString="Regenerate health over time when low. While regenerating, gain Cloak and low gravity!", LocalizedStrings=(("ar","تجديد الصحة بمرور الوقت عندما تكون منخفضة. خلال التجديد، احصل على عباءة تخفٍ!"),("en","Regenerate health over time when low. While regenerating, gain Cloak!"),("de","Regeneriere schrittweise Kondition, wenn diese niedrig ist. Während du Kondition regenerierst, erhältst du Tarnung!"),("es","Recupera salud de forma prolongada cuando esté baja. ¡Mientras te regeneras, te vuelves invisible!"),("es-419","Regeneras vida con el tiempo cuando esté baja. Mientras te regeneras, ¡activas el modo sigilo!"),("fr","Régénère des PV sur la durée quand les PV sont bas. Confère l'effet Camouflage pendant la régénération des PV !"),("id","Memulihkan HP seiring waktu saat HP rendah. Berkamuflase saat memulihkan HP!"),("it","Rigenera salute nel tempo quando è bassa. Mentre rigeneri, ottieni occultamento!"),("ja","体力が低い時、時間経過と共に回復する。回復中はクロークを得る！"),("ko","체력이 낮으면 지속 재생합니다. 재생 중 은신 상태가 됩니다!"),("pl","Stopniowo regeneruje zdrowie, gdy jego poziom jest niski. Podczas regeneracji zyskujesz kamuflaż!"),("pt-BR","Regenera vida ao longo do tempo quando estiver baixa. Ao regenerar, ganha Camuflagem!"),("ru","Постепенно восстанавливает здоровье, когда его мало. Пока здоровье восстанавливается, делает персонажа невидимым."),("th","ฟื้นฟูพลังชีวิตอย่างต่อเนื่องเมื่อมีพลังชีวิตต่ำ ระหว่างฟื้นฟูจะได้รับเอฟเฟกต์ล่องหน!"),("tr","Canın azaldığında zamanla can yeniler. Can yenilenirken kamuflaj kazanırsın!"),("vi","Hồi HP theo thời gian khi HP ở mức thấp. Nhận hiệu ứng Vô Hình trong khi hồi phục!"),("zh-hans","生命值低时，会持续恢复生命值。恢复时，获得隐形！"),("zh-Hant","生命值過低時，逐漸恢復生命值。恢復生命值時，獲得隱形狀態！")))
+TextReplacements=(Category=Game, Namespace="", Key="9838363745E27BE91724E7ABB9CF15A5", NativeString=" Regenerate health over time when low. While regenerating, gain Cloak and low gravity! Health regenerated to increases at each Level Up: 60 Health -> 70 Health -> 80 Health -> 90 Health -> 100 Health", LocalizedStrings=(("ar","تجديد الصحة بمرور الوقت عندما تكون منخفضة. خلال التجديد، احصل على عباءة تخفٍ! يزداد مقدار الصحة المجددة مع كل ارتفاع بالمستوى: 60 نقطة صحة -> 70 نقطة صحة -> 80 نقطة صحة -> 90 نقطة صحة -> 100 نقطة صحة."),("en"," Regenerate health over time when low. While regenerating, gain Cloak! Health regenerated to increases at each Level Up: 60 Health -> 70 Health -> 80 Health -> 90 Health -> 100 Health"),("de","Regeneriere schrittweise Kondition, wenn diese niedrig ist. Während du Kondition regenerierst, erhältst du Tarnung! Die regenerierte Kondition erhöht sich mit jedem Levelaufstieg: 60 Kondition -> 70 Kondition -> 80 Kondition -> 90 Kondition -> 100 Kondition"),("es","Recupera salud de forma prolongada cuando esté baja. ¡Mientras te regeneras, te vuelves invisible! La salud regenerada aumenta con cada subida de nivel: 60 de salud -> 70 de salud -> 80 de salud -> 90 de salud -> 100 de salud"),("es-419","Regeneras vida con el tiempo cuando esté baja. Mientras te regeneras, ¡activas el modo sigilo! La vida regenerada aumenta cada vez que subes de nivel: 60 de vida -> 70 de vida -> 80 de vida -> 90 de vida -> 100 de vida"),("fr","Régénère des PV sur la durée quand les PV sont bas. Confère l'effet Camouflage pendant la régénération des PV ! Les PV récupérés augmentent à chaque montée de niveau : 60 PV -> 70 PV -> 80 PV -> 90 PV -> 100 PV"),("id","Memulihkan HP seiring waktu saat HP rendah. Berkamuflase saat memulihkan HP! Regenerasi Health meningkat tiap Naik Level: 60 HP -> 70 HP -> 80 HP -> 90 HP -> 100 HP"),("it","Rigenera salute nel tempo quando è bassa. Mentre rigeneri, ottieni occultamento! La salute rigenerata aumenta a ogni passaggio di livello: 60 salute -> 70 salute -> 80 salute -> 90 salute -> 100 salute"),("ja","体力が低い時、時間経過と共に回復する。回復中はクロークを得る！レベルアップごとに回復する体力が増加する: 体力60 -> 体力70 -> 体力80 -> 体力90 -> 体力100"),("ko","체력이 낮으면 지속 재생합니다. 재생 중 은신을 얻습니다! 레벨업 시 체력 재생량 증가: 체력 60 -> 체력 70 -> 체력 80 -> 체력 90 -> 체력 100"),("pl","Stopniowo regeneruje zdrowie, gdy jego poziom jest niski. Podczas regeneracji zyskujesz kamuflaż! Odnowione zdrowie zwiększa się przy każdym awansie na nowy poziom: 60 pkt. zdrowia -> 70 pkt. zdrowia -> 80 pkt. zdrowia -> 90 pkt. zdrowia -> 100 pkt. zdrowia"),("pt-BR","Regenera vida ao longo do tempo quando estiver baixa. Ao regenerar, ganha Camuflagem! A vida regenerada aumenta a cada Subida de Nível: 60 de Vida -> 70 de Vida -> 80 de Vida -> 90 de Vida -> 100 de Vida"),("ru","Постепенно восстанавливает здоровье, когда его мало. Пока здоровье восстанавливается, делает персонажа невидимым. Количество восстанавливаемого здоровья увеличивается с каждым новым уровнем: 60 ед. здоровья -> 70 ед. здоровья -> 80 ед. здоровья -> 90 ед. здоровья -> 100 ед. здоровья"),("th","ฟื้นฟูพลังชีวิตอย่างต่อเนื่องเมื่อมีพลังชีวิตต่ำ ระหว่างฟื้นฟูจะได้รับเอฟเฟกต์ล่องหน! การฟื้นฟูพลังชีวิตจะเพิ่มขึ้นทุกครั้งที่เลเวลอัป: 60 -> 70 -> 80 -> 90 -> 100 หน่วย"),("tr","Canın azaldığında zamanla can yeniler. Can yenilenirken kamuflaj kazanırsın! Seviye atladıkça yenilenen can miktarı artar: 60 Can -> 70 Can -> 80 Can -> 90 Can -> 100 Can"),("vi","Hồi HP theo thời gian khi HP ở mức thấp. Nhận hiệu ứng Vô Hình trong khi hồi phục! HP hồi phục tăng ở mỗi lần Lên Cấp: 60 HP -> 70 HP -> 80 HP -> 90 HP -> 100 HP"),("zh-hans","生命值低时，会持续恢复生命值。恢复时，获得隐形！每次升级时恢复的生命值都会增加：60点 -> 70点 -> 80点 -> 90点 -> 100点"),("zh-Hant","生命值過低時，逐漸恢復生命值。恢復生命值時，獲得隱形狀態！每次升級時，恢復的生命值都會增加：60 生命值 -> 70 生命值 -> 80 生命值 -> 90 生命值 -> 100 生命值"))) 
