+TextReplacements=(Category=Game, Namespace="AIPromptModerationMessages", bIsMinimalPatch=True, Key="SelfHarm", NativeString="You are valued. Help is available from professionals and your local crisis hotline.", LocalizedStrings=(("ar","أنت موضع تقدير. يمكنك الحصول على مساعدة من المختصين ومن خط المساعدة الساخن المحلّي الخاص بك."),("de","Du wirst geschätzt. Du kannst Hilfe von Fachleuten und über deine örtliche Krisenhotline erhalten."),("es","Tu vida es valiosa. Puedes obtener ayuda de profesionales y de tu línea local de ayuda en casos de emergencia."),("es-419","Tu vida es valiosa. Puedes obtener ayuda de profesionales y mediante la línea de atención de crisis en tu ubicación."),("fr","Vous êtes quelqu'un d'important. Vous pouvez obtenir de l'aide auprès de professionnels et de votre service local de prévention des crises."),("id","Dirimu berharga. Bantuan tersedia dari para profesional dan saluran bantuan krisis di daerahmu."),("it","Tu sei importante. Puoi ricevere aiuto da parte di professionisti e tramite la linea di assistenza per le crisi locale."),("ja","あなたは大切な存在です。専門家や地域の緊急ホットラインが力を貸してくれるはず。"),("ko","당신은 소중한 존재입니다. 전문가나 정신건강 위기상담전화를 통해 도움을 받을 수 있습니다."),("pl","Jesteś wartościową osobą. Możesz uzyskać pomoc, kontaktując się ze specjalistą lub dzwoniąc na lokalny telefon zaufania."),("pt-BR","Você tem muito valor. É possível obter ajuda com profissionais e pela linha de emergência local."),("ru","Тебя ценят. Ты всегда можешь обратиться за помощью к специалистам или позвонить по местному телефону доверия."),("th","คุณมีคุณค่า คุณสามารถขอความช่วยเหลือจากผู้เชี่ยวชาญและสายด่วนช่วยเหลือในพื้นที่ของคุณได้"),("tr","Değerlisin. Profesyonellerden ve yerel kriz hattından yardım alabilirsin."),("vi","Bạn đáng được trân trọng. Bạn có thể nhận được sự giúp đỡ từ các chuyên gia và đường dây nóng hỗ trợ khủng hoảng tại nơi bạn sống."),("zh-hans","你很重要。专业人士和当地危机热线可以为你提供帮助。"),("zh-Hant","你的生命很珍貴。你可以向專業人士和當地的危機處理專線尋求協助。")))
