+TextReplacements=(Category=Game, Namespace="", bIsMinimalPatch=True, Key="51E9A2C44B5684487E2EACAAA4C800E0", NativeString="Batman here. Poison Ivy stashed pieces of the city around the Mainland. Go investigate. <empha>Clear 3 Gotham Challenges</>. I’d join you, but my butler-- er, buddy-- does all the gardening.", LocalizedStrings=(("pt-BR","Aqui é o Batman. A Hera Venenosa escondeu peças da cidade pela Ilha Principal. Vá investigar. <empha>Conclua 3 Desafios de Gotham</>. Eu até iria com você, mas meu mordomo... quer dizer, meu amigo... cuida dos jardins.")))
+TextReplacements=(Category=Game, Namespace="", bIsMinimalPatch=True, Key="682553B449916028493312866290D1E9", NativeString="Poison Ivy’s plan really stinks. She’s been making everyone in Gotham use \"the little bats room\" to turn the sewers into giant, gas filled boom-boom tunnels. And they're ready to blow. <empha>Craft 10 Biomass</> by putting <empha>any organic resources in a Compost Bin</>. We can reverse engineer a way to stop this, but I need you to find some Biomass for me to analyze.", LocalizedStrings=(("pt-BR","O plano da Hera Venenosa é um nojo. Ela fez todo mundo em Gotham usar o banheiro para transformar os esgotos em enormes túneis cheios de gás, altamente explosivos. E eles já estão prontos para explodir. <empha>Crie 10 de Biomassa</> colocando <empha>qualquer recurso orgânico em uma Composteira</>. Podemos descobrir como parar isso analisando o mecanismo, mas preciso que você encontre Biomassa para eu analisar.")))
