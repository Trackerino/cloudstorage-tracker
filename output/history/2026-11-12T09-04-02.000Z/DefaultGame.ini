+TextReplacements=(Category=Game, Namespace="", Key="24EBABA941C90D82A86E39878644F061", NativeString="Placeholder", LocalizedStrings=(("ar","أرواح خدعة أم حلوى معززة ومسدسات ريبيكا الغريبة وبخاخات مخيفة لتربحها!"),("en","Boosted Trick or Treat Sprites, Exotic Rebecca’s Guns, and spooky Sprays to earn!"),("de","Erhöhte Chance auf Süßes-oder-Saures-Geister, exotische Waffen von Rebecca und gruselige Spraymotive zum Verdienen!"),("es","¡Consigue espíritus de truco o trato potenciados, las pistolas de Rebecca exóticas y grafitis espeluznantes para ganar!"),("es-419","¡Espíritus de dulce o truco potenciados, armas de Rebecca exóticas y aerosoles aterradores para obtener!"),("fr","Esprits farce ou friandise boostés, aérosols effrayants à gagner et fusils de Rebecca exotiques !"),("id","Sprite Trick or Treat yang Diperkuat, Senjata Exotic Rebecca, dan Cat Semprot seram menantimu untuk didapatkan!"),("it","Spiritelli dolcetto o scherzetto potenziati, armi Esotiche di Rebecca e spray spaventosi da guadagnare!"),("ja","トリック・オア・トリートの精霊、レベッカの銃(エキゾチック)の出現率アップ、そして不気味なスプレーをゲットしよう！"),("ko","부스트된 사탕 주면 안 잡아먹지 정령, 이색 레베카의 총, 오싹한 스프레이!"),("pl","Zdobądź wzmocnione Duszki – Cukierek albo Psikus, egzotyczną Spluwę Rebekki i upiorne graffiti, aby zdobyć nagrody!"),("pt-BR","Elementais Gostosuras ou Travessuras Aprimorados, Armas Exóticas da Rebecca e Sprays assustadores para ganhar!"),("ru","Больше хэллоуинских духов, экзотические пушки Ребекки и жуткие граффити ждут вас!"),("th","บูสต์สไปรต์หลอกหรือเลี้ยง ปืนของรีเบคก้าระดับล้ำค่า และสเปรย์หลอนให้สะสม!"),("tr","Artırılmış Cadı Büyücükler, Egzotik Rebecca'nın Silahları ve ürkütücü spreyler kazanabilirsin!"),("vi","Tăng tỷ lệ xuất hiện Tinh Linh Cho Kẹo Hay Bị Ghẹo, Súng Của Rebecca Huyền Bí và Hình Xịt ma quái để nhận!"),("zh-Hans","赢取已强化的不给糖就捣蛋精灵、奇异丽贝卡双枪，还有恐怖涂鸦！"),("zh-Hant","不給糖就搗蛋精靈、奇異瑞貝卡的槍，以及詭異噴畫出現機率提升，等你來拿！")))
