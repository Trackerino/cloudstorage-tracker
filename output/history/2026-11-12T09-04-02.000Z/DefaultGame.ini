+TextReplacements=(Category=Game, Namespace="", Key="2CB4FF0D47349C9DDB55EE84641B6B1A", NativeString="Aw, what a perfect little sidekick.", LocalizedStrings=(("ar","أوه، يا له من مُرافِق صغير مثالي."),("en","Aw, what a perfect little Sidekick."),("de","Och, was für ein lieber kleiner Begleiter."),("es","¿Quién es mi compañero preferido?"),("es-419","Ay, qué compañero tan ideal."),("fr","Qui qui c'est la meilleure mascotte ? Mais oui, c'est toi !"),("id","Aw, Maskot kecil yang sempurna."),("it","Oooh, che mascotte perfetta."),("ja","あぁ、なんて完璧なバディなんだろう。"),("ko","아우, 정말 완벽한 꼬마 사이드킥이네요."),("pl","Och, jaki słodziutki, malutki druh."),("pt-BR","Ain, que mascotinho perfeitinho."),("ru","Какой милый спутник!"),("th","แหม ช่างเป็นคู่หูตัวน้อยที่เพอร์เฟ็กต์เหลือเกิน"),("tr","Ay, sen ne tatlı yoldaşsın öyle."),("vi","Chà, đúng là một Trợ Thủ bé nhỏ hoàn hảo."),("zh-Hans","哎哟，多完美的小搭档。"),("zh-Hant","噢，真是個天選小跟班。")))
