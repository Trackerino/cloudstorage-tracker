+TextReplacements=(Category=Game, Namespace="", Key="2DB26C364AC0B45B975A239FE42F08C9", NativeString="Boosted Wanted Posters All Day!", LocalizedStrings=(("ar","صناديق الأرواح المعززة وملصقات المطلوبين طوال اليوم!"),("en","Boosted Sprite Chests and Wanted Posters All Day!"),("de","Erhöhte Geisttruhen und Fahndungsplakate den ganzen Tag lang!"),("es","¡Cofres de espíritus potenciados y carteles de Se busca todo el día!"),("es-419","¡Cofres de espíritus potenciados y carteles de Se busca todo el día!"),("fr","Coffres à esprits et avis de recherche boostés toute la journée !"),("id","Peti Sprite yang Ditingkatkan dan Poster Buron Sepanjang Hari!"),("it","Forzieri degli spiritelli e manifesti da ricercato potenziati tutto il giorno!"),("ja","精霊の宝箱と手配書の出現率アップが終日開催！"),("ko","하루 종일 부스트된 정령 상자와 현상수배 포스터!"),("pl","Wzmocnione skrzynie Duszków i listy gończe przez cały dzień!"),("pt-BR","Baús de Elemental turbinados e Cartazes de Procurado o dia todo!"),("ru","Весь день — больше сундуков духов и плакатов о розыске!"),("th","บูสต์หีบสไปรต์และใบประกาศจับตลอดทั้งวัน!"),("tr","Gün Boyu Artırılmış Büyücük Sandıkları ve Aranıyor Posterleri!"),("vi","Rương Tinh Linh Nâng Cấp Và Áp Phích Truy Nã Cả Ngày!"),("zh-Hans","全天强化精灵宝箱和通缉令！"),("zh-Hant","全天精靈寶箱與懸賞單出現機率提升！")))
+TextReplacements=(Category=Game, Namespace="", Key="EA9EFFCD47A1684CD52FEF94F0591C5D", NativeString="<text fontface=\"75 Medium\">Storm Uzi's stronghold with new weapons and Sprites</>\r\nIt’s time for a little chaos. Lil Uzi and Cuddle Team Leader have claimed a fort of their own, while Buggy and the Megalodon crash onto the island looking for trouble. New weapons, strange new Sprites, and plenty of firepower for the hunt.", LocalizedStrings=(("ar","<text fontface=\"75 Medium\">اقتحم حصن Uzi بأسلحة وأرواح جديدة</>\r\nحان وقت القليل من الفوضى. استولى Lil Uzi وقائدة فريق العناق على حصن خاص بهما، بينما وصل باغي إلى الجزيرة بحثًا عن المتاعب. أسلحة جديدة وأرواح غريبة جديدة وقوة نارية وفيرة من أجل المغامرة."),("en","<text fontface=\"75 Medium\">Storm Uzi's stronghold with new weapons and Sprites</>\r\nIt's time for a little chaos. Lil Uzi and Cuddle Team Leader have claimed a fort of their own, while Buggy has arrived on the island looking for trouble. New weapons, strange new Sprites, and plenty of firepower for the hunt."),("de","<text fontface=\"75 Medium\">Stürme Uzis Festung mit neuen Waffen und Geistern</>\r\nEs wird Zeit für ein bisschen Chaos. Lil Uzi und die Kuschelbeauftragte haben ein eigenes Fort besetzt, während Buggy auf der Insel eingetroffen ist und Ärger sucht. Neue Waffen, seltsame neue Geister und jede Menge Feuerkraft für die Jagd."),("es","<text fontface=\"75 Medium\">Asalta la Fortaleza de Uzi con nuevas armas y espíritus</>\r\nEs hora de desatar el caos. Lil Uzi y la Líder del equipo arrumacos se han apoderado de un fuerte, mientras que Buggy ha llegado a la isla con ganas de dar problemas. Nuevas armas, nuevos y extraños espíritus y mucha potencia de fuego para la caza."),("es-419","<text fontface=\"75 Medium\">Asalta la Fortaleza de Uzi con nuevas armas y espíritus</>\r\n¡Hora de causar un poco de caos! Lil Uzi y Líder del equipo cariñoso se apoderaron de un fuerte, mientras que Buggy llegó a la isla buscando problemas. Nuevas armas, espíritus extraños y un arsenal de artillería pesada para la caza."),("fr","<text fontface=\"75 Medium\">Prenez d'assaut la Forteresse d'Uzi avec de nouvelles armes et de nouveaux esprits</>\r\nL'heure est au chaos. Lil Uzi et l'Experte des câlins ont pris le contrôle d'un fort, tandis que Baggy est arrivé sur l'île, bien décidé à en découdre. De nouvelles armes, de nouveaux esprits étranges et des armes à feu dignes d'une chasse."),("id","<text fontface=\"75 Medium\">Serbu markas Uzi yang kuat dengan senjata dan Sprite baru</>\r\nSaatnya sedikit kekacauan. Lil Uzi dan Pemimpin Tim Peluk sudah menguasai benteng mereka sendiri, sementara Buggy telah tiba di pulau untuk mencari masalah. Senjata baru, Sprite baru yang aneh, dan banyak daya tempur untuk perburuan."),("it","<text fontface=\"75 Medium\">Assalta la fortezza di Uzi con nuove armi e nuovi spiritelli</>\r\nÈ ora di un po' di caos. Lil Uzi e la Leader della Squadra delle Coccole hanno conquistato il loro forte, mentre Bagy è arrivato sull'isola in cerca di guai. Nuove armi, nuovi spiritelli bizzarri e una potenza di fuoco pazzesca per la caccia."),("ja","<text fontface=\"75 Medium\">新しい武器と精霊とともにLil' Uzi ストロングホールドに突撃</>\r\nさあ、カオスを巻き起こそう。Lil Uziとピンクのクマちゃんが自分の砦を確保する一方で、バギーが災いをもたらそうと島に乗り込んでくる。新しい武器、変わった新たな精霊、そして狩りのための十分な火力。"),("ko","<text fontface=\"75 Medium\">새로운 무기와 정령으로 우지의 요새를 습격하세</>\r\n혼돈을 좀 일으킬 시간입니다. 릴 우지와 포옹팀 리더가 요새를 차지했고, 버기가 섬에 들이닥쳐 소란을 일으킵니다. 새로운 무기, 기묘한 새로운 정령, 사냥을 위한 막강한 화력이 준비되었습니다."),("pl","<text fontface=\"75 Medium\">Zajmij twierdzę Uziego, używając nowych broni i Duszków</>\r\nPora na trochę chaosu. Lil Uzi i Dowódczyni Drużyny Przytulanek zajęli jeden z fortów, podczas gdy na wyspie pojawia się Buggy w poszukiwaniu kłopotów. Nowe rodzaje broni, tajemnicze Duszki i potężna siła ognia, która przyda się podczas polowania."),("pt-BR","<text fontface=\"75 Medium\">Invada a fortaleza de Uzi com novas armas e Elementais</>\r\nEstá na hora de um pouco de caos. Lil Uzi e a Líder da Equipe de Abraços assumiram o comando de um forte, enquanto Buggy chegou à Ilha procurando encrenca. Novas armas, novos Elementais estranhos e muito poder de fogo para a caça."),("ru","<text fontface=\"75 Medium\">Штурмуйте крепость Uzi с новым оружием и духами</>\r\nСамое время немного пошалить. Lil Uzi и Капитан команды по обнимашкам заняли собственный форт, а Багги прибыл на остров в поисках неприятностей. Новое оружие, необычные духи и арсенал для охоты."),("th","<text fontface=\"75 Medium\">บุกป้อมปราการของ Uzi ด้วยอาวุธและสไปรต์ใหม่</>\r\nได้เวลาสร้างความปั่นป่วนนิดหน่อยแล้ว Lil Uzi และผู้นำทีมคัดเดิ้ลได้ยึดป้อมเป็นของตัวเอง ในขณะที่บากี้มาถึงเกาะเพื่อหาเรื่องวุ่นวาย อาวุธใหม่ สไปรต์ใหม่สุดแปลก และพลังทำลายล้างที่จัดเต็มสำหรับการออกล่า"),("tr","<text fontface=\"75 Medium\">Yeni silahlar ve büyücüklerle Uzi'nin Kalesi'ne saldır.</>\r\nIt Anlaşılan biraz kaos çıkarmanın vakti geldi. Lil Uzi ve Minnoş Takım Lideri kendilerine ait bir kale kurarken Buggy ise adada bela arıyor. Yeni silahlar, yeni tuhaf Büyücükler ve av için bir sürü mühimmat."),("vi","<text fontface=\"75 Medium\">Tấn công pháo đài của Uzi với vũ khí mới và Tinh Linh mới</>\r\nGiờ là lúc cần một chút hỗn loạn rồi. Lil Uzi và Thủ Lĩnh Đội Âu Yếm đã chiếm một pháo đài cho riêng mình, trong khi Buggy đã đến hòn đảo để kiếm chuyện. Nhiều vũ khí mới, Tinh Linh mới kì lạ và hỏa lực cực mạnh cho cuộc săn."),("zh-Hans","<text fontface=\"75 Medium\">用新武器和精灵闯入Uzi的据点</>\r\n是时候来点混乱了。Lil Uzi和抱抱队队长已占领了一座属于他们自己的堡垒，而巴基也已抵达岛屿，想要寻找麻烦。新武器、奇怪的新精灵，还有充足的火力，让你畅快狩猎。"),("zh-Hant","<text fontface=\"75 Medium\">用新武器與精靈強攻 Uzi 要塞。</>\r\n是時候來點混亂了。Lil Uzi 和抱抱隊長各自佔領了一座堡壘，而巴其也來到島上，準備大鬧一場。新武器、奇怪的新精靈，以及還有滿滿火力助你展開尋寶之旅。")))
