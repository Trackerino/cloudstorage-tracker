+TextReplacements=(Category=Game, Namespace="FortSettingValueDiscreteSupervised", Key="IARC_SETTING_DESCRIPTION", NativeString="Set the content rating for all devices using this account. Experiences rated higher than the selected rating will require PIN to be unlocked.\n\n<strong>12+</>: Violence involving fantasy characters and/or non-graphic violence involving human-looking characters or animals is permitted. Non-graphic nudity, mild language and simulated gambling are also permitted, but sexual expletives are not.\n\n<strong>7+</>: May contain some scenes or sounds that are frightening for children. Mild violence (implied or non-realistic) is permitted.\n\n<strong>3+</>: Suitable for all age groups. Some violence in a comical or fantasy context is acceptable. Bad language is not permitted.\n\nLearn more about ratings: https://www.globalratings.com/ratings-guide-generic", LocalizedStrings=(("ar","عيّن تصنيف المحتوى لجميع الأجهزة التي تستخدم هذا الحساب. ستتطلب التجارب المصنفة بتصنيف أعلى من التصنيف المحدد رقم تعريف شخصيًا لفتحها.\n\n<strong>أكبر من 16 عامًا</>: مناسب لمن يبلغون 16 عامًا فما فوق.\n\n<strong>أكبر من 12 عامًا</>: يُسمح بالعنف الذي يتضمن شخصيات خيالية و/أو العنف غير الرسومي الذي يتضمن شخصيات شبيهة بالبشر أو حيوانات. كما يُسمح بالعري غير الكامل والألفاظ الحادة والمقامرة الصورية، ولكن لا يُسمح بالألفاظ الجنسية الصريحة.\n\n<strong>أكبر من 7 أعوام</>: قد يحتوي على بعض المشاهد أو الأصوات المخيفة للأطفال. يُسمح بالعنف المعتدل (ضمنيًا أو غير واقعي).\n\n<strong>أكبر من 3 أعوام</>: مناسب لجميع الفئات العمرية. بعض أعمال العنف في سياق هزلي أو خيالي مقبول. لا يُسمح باللغة البذيئة.\n\nتعرف على المزيد عن التصنيفات: https://www.globalratings.com/ratings-guide-generic"),("en","Set the content rating for all devices using this account. Experiences rated higher than the selected rating will require PIN to be unlocked.\n\n<strong>16+</>: Suitable for those aged 16 and above.\n\n<strong>12+</>: Violence involving fantasy characters and/or non-graphic violence involving human-looking characters or animals is permitted. Non-graphic nudity, mild language and simulated gambling are also permitted, but sexual expletives are not.\n\n<strong>7+</>: May contain some scenes or sounds that are frightening for children. Mild violence (implied or non-realistic) is permitted.\n\n<strong>3+</>: Suitable for all age groups. Some violence in a comical or fantasy context is acceptable. Bad language is not permitted.\n\nLearn more about ratings: https://www.globalratings.com/ratings-guide-generic"),("de","Lege die Inhaltseinstufung für alle Geräte fest, die diesen Account verwenden. Für Erlebnisse mit einer höheren Einstufung als die ausgewählte wird eine PIN zum Freischalten benötigt.\n\n<strong>16+</>: Geeignet für Personen ab 16 Jahren.\n\n<strong>12+</>: Gewalt gegenüber Fantasy-Charakteren und/oder nichtgrafische Gewalt gegenüber menschenähnlichen Charakteren oder Tieren ist erlaubt. Unvollständige Nacktheit, milde Kraftausdrücke und simuliertes Glücksspiel sind ebenfalls erlaubt, sexuelle Kraftausdrücke jedoch nicht.\n\n<strong>7+</>: Kann Szenen oder Geräusche enthalten, die für Kinder beängstigend sein können. Leichte Gewalt (impliziert oder unrealistisch) ist erlaubt.\n\n<strong>3+</>: Geeignet für alle Altersgruppen. Geringfügige Gewalt in einem komischen oder Fantasy-Kontext ist akzeptabel. Kraftausdrücke sind nicht erlaubt.\n\nErfahre hier mehr über die Einstufungen: https://www.globalratings.com/ratings-guide-generic"),("es","Establece la calificación de contenido para todos los dispositivos en los que se utilice esta cuenta. Es necesario introducir la contraseña para desbloquear las experiencias con una calificación superior a la seleccionada.\n\n<strong>16+:</> apto para mayores de 16 años.\n\n<strong>12+:</> puede contener violencia hacia personajes fantásticos o violencia no realista hacia personajes humanos o animales. Puede incluir desnudez no gráfica y lenguaje moderado, y se permite la simulación de juegos de azar, pero no los comentarios sexistas.\n\n<strong>7+:</> puede contener escenas o sonidos que asusten a niños pequeños y de violencia implícita, no detallada y no realista.\n\n<strong>3+:</> apto para todas las edades. Puede incluir violencia menor en contextos cómicos o fantásticos. No se permite el lenguaje soez.\n\nMás información sobre las calificaciones en https://www.globalratings.com/ratings-guide-generic (en inglés)"),("es-419","Establece la clasificación de contenido para todos los dispositivos que usan esta cuenta. Se requerirá un PIN para desbloquear las experiencias con una clasificación más alta que la seleccionada.\n\n<strong>16+</>: Apto para mayores de 16 años.\n\n<strong>12+</>: Está permitida la violencia que involucra a personajes de fantasía o la violencia no gráfica que involucra a personajes de apariencia humana o animales. También se permiten la desnudez no gráfica, el lenguaje moderado y las apuestas simuladas, pero no está permitido el uso de comentarios o improperios sexuales.\n\n<strong>7+</>: Puede contener escenas o sonidos que atemorizan a los niños. Está permitida la violencia moderada (implícita o no realista).\n\n<strong>3+</>: Apto para todas las edades. Se acepta la violencia en contextos cómicos o de fantasía. No está permitido el uso de lenguaje soez.\n\nMás información sobre las clasificaciones: https://www.globalratings.com/ratings-guide-generic"),("fr","Définissez la classification du contenu pour tous les appareils associés à ce compte. Les expériences dont la classification est supérieure à celle sélectionnée nécessiteront un code PIN pour être déverrouillées.\n\n<strong>16 ans et plus</> : convient aux personnes de 16 ans et plus.\n\n<strong>12 ans et plus</> : violence impliquant des personnages imaginaires et/ou violence non graphique impliquant des personnages à figure humaine ou des animaux. Nudité non graphique, langage grossier modéré et jeux de hasard simulés sont autorisés, mais les jurons à caractère sexuel ne le sont pas.\n\n<strong>7 ans et plus</> : peut contenir des scènes ou des sons susceptibles d'effrayer les enfants. Violence modérée (implicite ou non réaliste) autorisée.\n\n<strong>3 ans et plus</> : convient à tous les groupes d'âge. Une certaine violence dans un contexte comique ou fantastique est acceptable. Le langage grossier n'est pas autorisé.\n\nEn savoir plus sur les classifications : https://www.globalratings.com/ratings-guide-generic"),("id","Atur rating konten untuk semua perangkat yang menggunakan akun ini. Experiences dengan rating yang lebih tinggi dari rating yang dipilih akan memerlukan PIN untuk dibuka.\n\n<strong>16+</>: Cocok untuk mereka yang berusia 16 tahun ke atas.\n\n<strong>12+</>: Kekerasan yang melibatkan karakter fantasi dan/atau kekerasan non-grafis yang melibatkan karakter mirip manusia atau hewan diperbolehkan. Ketelanjangan non-grafis, bahasa ringan, dan simulasi perjudian juga diperbolehkan, tetapi kata-kata kasar seksual tidak diperbolehkan.\n\n<strong>7+</>: Mungkin mengandung beberapa adegan atau suara yang menakutkan bagi anak-anak. Kekerasan ringan (tersirat atau tidak realistis) diperbolehkan.\n\n<strong>3+</>: Cocok untuk semua kelompok usia. Beberapa kekerasan dalam konteks komikal atau fantasi dapat diterima. Bahasa kasar tidak diperbolehkan.\n\nKetahui lebih lanjut tentang rating: https://www.globalratings.com/ratings-guide-generic"),("it","Imposta la classificazione dei contenuti per tutti i dispositivi che usano questo account. Per sbloccare le esperienze con una classificazione più alta di quella selezionata sarà necessario un PIN.\n\n<strong>16+</>: adatto a chi ha dai 16 anni in su.\n\n<strong>12+</>: sono permesse scene violente con personaggi di fantasia e/o scene di violenza non esplicita con personaggi dalle sembianze umane o animali. Sono permessi anche: nudità non esplicita, turpiloquio moderato e gioco d'azzardo simulato. Non sono permesse imprecazioni a sfondo sessuale.\n\n<strong>7+</>: può contenere scene o effetti audio spaventosi per i bambini più piccoli. Sono consentite scene di violenza moderata (suggerita o non realistica).\n\n<strong>3+</>: adatto a tutte le fasce di età. Eventuali scene di violenza in contesto comico o fantasioso sono accettabili. Il turpiloquio non è consentito.\n\nScopri di più sulle classificazioni: https://www.globalratings.com/ratings-guide-generic"),("ja","このアカウントを使用する全デバイスにおけるコンテンツの年齢評価を設定します。選択した年齢評価よりも上の年齢評価が付けられた体験は、暗証番号によるロックの解除が必要になります。\n\n<strong>16+</>: 16歳以上向け。\n\n<strong>12+</>: 空想的なキャラクターを対象とした暴力、および/または、人間のような見た目のキャラクター、あるいは動物を対象とした露骨でない暴力描写が許可されています。露骨でないヌードの描写や、緩やかな言葉づかい、およびシミュレートされたギャンブルも許可されていますが、卑わいな言葉は許可されていません。\n\n<strong>7+</>: 子どもが怖がるようなシーンや音が含まれている場合があります。軽度の暴力(暗示的なものや現実的でないもの)は許可されています。\n\n<strong>3+</>: 全年齢層に適しています。滑稽な、あるいは空想的な状況における暴力描写は一部許可されています。下品な言葉づかいは許可されていません。\n\n年齢評価の詳細はこちら: https://www.globalratings.com/ratings-guide-generic"),("ko","이 계정을 사용하는 모든 장치의 콘텐츠 이용등급을 설정합니다. 선택한 이용등급보다 높은 경험은 PIN이 있어야 잠금 해제할 수 있습니다.\n\n<strong>16세 이상 이용가</>: 16세 이상에게 적합합니다.\n\n<strong>12세 이상 이용가</>: 판타지 캐릭터를 향한 폭력, 인간형 캐릭터 또는 동물을 향한 세세하지 않은 폭력이 허용됩니다. 세세하지 않은 노출, 경미한 저속어, 가상 도박이 허용되지만 성적인 비속어는 허용되지 않습니다.\n\n<strong>7세 이상 이용가</>: 아동에게 공포감을 줄 수 있는 장면이나 소리가 포함될 수 있습니다. 경미한 폭력(암시 또는 비현실적)이 허용됩니다.\n\n<strong>3세 이상 이용가</>: 모든 연령층에 적합합니다. 희극적 또는 판타지적 상황에서의 경미한 폭력이 허용됩니다. 저속어는 허용되지 않습니다.\n\n이용등급 자세히 보기: https://www.globalratings.com/ratings-guide-generic"),("pl","Ustaw klasyfikację treści dla wszystkich urządzeń używających tego konta. Przygody mające klasyfikację wyższą niż wybrana, będą wymagać PIN-u do odblokowania.\n\n<strong>16+</>: Odpowiednie dla osób w wieku 16 lat i starszych.\n\n<strong>12+</>: Dozwolona jest przemoc wobec postaci fantastycznych i/lub nierealistyczna przemoc wobec postaci o ludzkim wyglądzie lub zwierząt. Dozwolone są także niedosłowna nagość, łagodne wulgaryzmy oraz symulowany hazard, ale nie przekleństwa seksualne.\n\n<strong>7+</>: Mogą zawierać sceny lub dźwięki przerażające dla młodszych dzieci. Dozwolona jest łagodna przemoc (niewyrażona wprost i nierealistyczna).\n\n<strong>3+</>: Odpowiednie dla wszystkich grup wiekowych. Dopuszczalna jest pewna przemoc w kontekście komicznym lub fantastycznym. Niedozwolone są wulgaryzmy.\n\nWięcej informacji o klasyfikacjach: https://www.globalratings.com/ratings-guide-generic"),("pt-BR","Defina a classificação de conteúdo para todos os dispositivos usando esta conta. Experiências com classificação de conteúdo acima da classificação selecionada exigirão PIN para desbloqueio.\n\n<strong>16+</>: Apropriado para pessoas de 16 anos ou mais.\n\n<strong>12+</>: Violência envolvendo personagens de fantasia e/ou violência não gráfica envolvendo personagens semelhantes a humanos ou animais é permitida. Nudez não gráfica, linguagem leve e simulação de apostas também são permitidas, mas não expletivos sexuais.\n\n<strong>7+</>: Pode conter algumas cenas ou sons assustadores para crianças. Violência leve (implícita ou não realista) é permitida.\n\n<strong>3+</>: Apropriado para todos os grupos etários. Alguma violência em contexto cômico ou de fantasia é aceitável. Linguagem vulgar não é permitida.\n\nSaiba mais sobre as classificações: https://www.globalratings.com/ratings-guide-generic"),("ru","Выберите возрастное ограничение для контента, которое будет действовать на всех устройствах, использующих эту учётную запись. Чтобы разблокировать острова, рейтинг которых выходит за рамки ограничений, понадобится ввести PIN-код.\n\n<strong>16+</>: подходит для лиц в возрасте от 16 лет и старше.\n\n<strong>12+</>: насилие по отношению к фантастическим персонажам и умеренное насилие по отношению к человекоподобным персонажам или животным. Также допускаются неявная нагота и бранные выражения или имитация азартных игр, но не брань, основанная на теме секса.\n\n<strong>7+</>: игра может содержать сцены или звуки, которые могут напугать детей. Допускаются упоминания жестокости и нереалистичные сцены насилия.\n\n<strong>3+</>: подходит для игроков всех возрастов. Допускается присутствие комических или сказочных сцен насилия. Ненормативная лексика запрещена.\n\nПодробнее о возрастных рейтингах: https://www.globalratings.com/ratings-guide-generic"),("th","ตั้งค่าการจัดเรตเนื้อหาให้กับอุปกรณ์ทั้งหมดที่ใช้บัญชีนี้ ประสบการณ์ที่ได้รับการจัดเรตสูงกว่าการจัดเรตที่เลือกไว้ด้องใช้รหัส PIN เพื่อปลดล็อก\n\n<strong>16+</>: เหมาะสำหรับผู้ที่มีอายุ 16 ปีขึ้นไป\n\n<strong>12+</>: อนุญาตให้ใช้เนื้อหาที่มีความรุนแรงเกี่ยวข้องกับตัวละครแฟนตาซีและ/หรือความรุนแรงที่ไม่สามารถเห็นได้อย่างชัดแจ้งซึ่งเกี่ยวข้องกับตัวละครคล้ายมนุษย์หรือสัตว์ และอนุญาตให้ใช้ภาพเปลือยที่ไม่สามารถเห็นได้อย่างชัดแจ้ง ภาษาที่ไม่รุนแรงมาก และพนันจำลอง แต่ไม่อนุญาตให้ใช้คำหยาบคายเกี่ยวกับเรื่องเพศ\n\n<strong>7+</>: อาจมีฉากหรือเสียงที่ทำให้เด็กๆ กลัวได้ โดยอนุญาตให้มีฉากรุนแรงเล็กน้อย (แสดงอย่างไม่ชัดแจ้งหรือดูเกินจริง)\n\n<strong>3+</>: เหมาะสำหรับผู้ชมทุกช่วงวัย อาจมีความรุนแรงในบริบทตลกหรือแฟนตาซีบ้าง แต่ไม่อนุญาตให้ใช้ภาษาหยาบคาย\n\nดูข้อมูลเพิ่มเติมเกี่ยวกับการจัดเรตได้ที่: https://www.globalratings.com/ratings-guide-generic"),("tr","Bu hesabı kullanan tüm cihazlar için içerik derecelendirmesini belirle. Seçili derecelendirmeden daha yüksek bir derecelendirmeye sahip deneyimlerin açılması için PIN kodu gerekir.\n\n<strong>16+</>: 16 yaş ve üzeri için uygundur.\n\n<strong>12+</>: Fantastik karakterler içeren şiddet ve/veya insan görünümlü karakterlere ya da hayvanlara karşı sansürlü şiddete izin verilir. Sansürlü çıplaklık, hafif düzey argo kullanımı ve kumar benzeri öğelere de izin verilir ancak cinsel içerikli sözlere izin verilmez.\n\n<strong>7+</>: Çocuklar için korkutucu olabilecek sahneler ya da sesler içerebilir. Hafif düzey (ima edilen veya gerçekçi olmayan) şiddete izin verilir.\n\n<strong>3+</>: Tüm yaş grupları için uygundur. Komik ya da fantastik bağlamda şiddet kabul edilebilir. Argo kullanımına izin verilmez.\n\nDerecelendirmeler hakkında daha fazla bilgi için: https://www.globalratings.com/ratings-guide-generic"),("vi","Thiết lập xếp hạng nội dung cho tất cả thiết bị sử dụng tài khoản này. Những trải nghiệm có mức xếp hạng cao hơn xếp hạng đã chọn sẽ yêu cầu mã PIN để mở khóa.\n\n<strong>16+</>: Phù hợp cho những người từ 16 tuổi trở lên.\n\n<strong>12+</>: Cho phép bạo lực liên quan đến nhân vật viễn tưởng và/hoặc bạo lực không khắc họa chi tiết liên quan đến các nhân vật giống người hoặc động vật. Khỏa thân không khắc họa chi tiết, một số ngôn ngữ xúc phạm và cờ bạc mô phỏng cũng được phép, nhưng ngôn ngữ khêu gợi không được phép.\n\n<strong>7+</>: Có thể chứa một số cảnh hoặc âm thanh đáng sợ với trẻ nhỏ. Bạo lực trung bình (hàm ý hoặc phi thực tế) cũng được phép.\n\n<strong>3+</>: Phù hợp với mọi nhóm tuổi. Một số cảnh bạo lực trong bối cảnh hài hước hoặc viễn tưởng được chấp nhận. Không cho phép ngôn ngữ xúc phạm.\n\nTìm hiểu thêm về mức xếp hạng: https://www.globalratings.com/ratings-guide-generic"),("zh-Hans","为使用该账户的所有设备设置内容评级。高于所选评级的体验需要PIN码才可解锁。\n\n<strong>16+</>：适合 16 岁及以上用户。\n\n<strong>12+</>：允许出现涉及虚构角色的暴力和/或涉及类人角色或动物的非直观暴力。此外，还允许出现非直观裸露、轻度粗俗用语和模拟赌博，但不允许出现性辱骂。\n\n<strong>7+</>：可能包含一些让儿童害怕的场景或声音。允许轻度暴力（暗示性或不逼真）。\n\n<strong>3+</>：适合所有年龄段。在喜剧或幻想背景下的某些暴力是允许的。不允许粗俗用语。\n\n了解更多评级信息：https://www.globalratings.com/ratings-guide-generic"),("zh-Hant","設定此帳號在所有裝置上使用的內容分級。高於所選分級的體驗將需要 PIN 碼才能解鎖。\n\n<strong>16+</>：適合 16 歲以上。\n\n<strong>12+</>：允許涉及奇幻角色及/或對擬人角色或動物的非寫實暴力。允許非寫實裸露、輕度語言和模擬賭博，但不允許性暗示用語。\n\n<strong>7+</>：可能包含對兒童來說可怕的場景或聲音。允許輕度暴力（隱含或非寫實）。\n\n<strong>3+</>：適合所有年齡組。允許喜劇或奇幻背景下的某些暴力。不允許不良語言。\n\n了解分級的詳情：https://www.globalratings.com/ratings-guide-generic"))) 
