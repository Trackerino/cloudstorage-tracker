+TextReplacements=(Category=Game, Namespace="", Key="B985B5E245DA474CAA126AB772DC8341", NativeString="New Weapons, Sprites, and a new piece of the Treasure Map to be found!", LocalizedStrings=(("ar","أنت أمام أسلحة وأرواح جديدة، وجزء جديد من خريطة الكنز لتعثر عليه!\r\nسيطر Lil Uzi على الحصن!"),("en","New Weapons, Sprites, and a new piece of the Treasure Map to be found!\r\nThe Lil Uzi has taken over the Stronghold!"),("de","Neue Waffen, Geister und ein neuer Teil der Schatzkarte zum Auffinden!\r\nDie Lil Uzi hat die Festung übernommen!"),("es","¡Podrás encontrar nuevas armas, espíritus y un nuevo fragmento del mapa del tesoro!\r\n¡Lil Uzi ha tomado la fortaleza!"),("es-419","¡Hay nuevas armas, espíritus y una nueva pieza del mapa del tesoro por encontrar!\r\n¡Lil Uzi tomó el control de la fortaleza!"),("fr","De nouvelles armes, de nouveaux esprits et un nouveau fragment de la carte au trésor à trouver !\r\nLil Uzi s'est emparé de la forteresse !"),("id","Senjata Baru, Sprite Baru, dan bagian baru dari Peta Harta Karun untuk ditemukan!\r\nLil Uzi telah merebut Benteng!"),("it","Nuove armi, spiritelli e un nuovo pezzo della mappa del tesoro da trovare!\r\nLil Uzi ha preso il controllo della Fortezza!"),("ja","新しい武器、精霊、そして宝の地図の新しい断片を探そう！\r\nLil Uziがストロングホールドを乗っ取った！"),("ko","신규 무기, 정령 그리고 찾을 수 있는 새로운 보물 지도 조각까지!\r\n릴 우지가 요새를 차지했습니다!"),("pl","Nowe bronie, Duszki i nowy fragment mapy skarbów do znalezienia!\r\nLil Uzi przejmuje Twierdzę!"),("pt-BR","Novas armas, Elementais e um novo fragmento do Mapa do Tesouro para encontrar!\r\nLil Uzi assumiu a Fortaleza!"),("ru","Новое оружие, новые духи и новый фрагмент карты сокровищ!\r\nLil Uzi Vert обосновывается в крепости!"),("th","พบอาวุธใหม่ สไปรต์ใหม่ และชิ้นส่วนแผนที่สมบัติชิ้นใหม่ได้แล้ว!\r\nLil Uzi ยึดครองฐานที่มั่นแล้ว!"),("tr","Yeni silahlar, Büyücükler ve yeni bir hazine haritası parçası bulunmayı bekliyor!\r\nLil Uzi kaleyi ele geçirdi!"),("vi","Nhiều Vũ Khí Mới, Tinh Linh mới và một mảnh Bản Đồ Kho Báu mới đang chờ bạ