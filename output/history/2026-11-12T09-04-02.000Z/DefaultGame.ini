+TextReplacements=(Category=Game, Namespace="", Key="DA0B15584C29543F62A544BBABA374CD", NativeString="Classic Jerry.", LocalizedStrings=(("ar","يفضل التحول إلى حشرة على الاستماع إلى محادثة."),("en","He'd rather be a bug than have a conversation."),("de","Er verkriecht sich lieber, als ein Gespräch zu führen."),("es","Prefiere ser un bicho antes que afrontar una conversación."),("es-419","Prefiere convertirse en insecto que conversar."),("fr","Il préfère être un cloporte que d'avoir une discussion."),("id","Dia lebih suka jadi serangga daripada harus mengobrol."),("it","Preferisce essere un insetto che affrontare una discussione."),("ja","昔から話し合いを避ける人だった。"),("ko","대화하느니 차라리 벌레가 되는 쪽을 선택할 겁니다."),("pl","Woli zamienić się w robala niż porozmawiać."),("pt-BR","Ele prefere virar um inseto do que ter um diálogo."),("ru","Он лучше станет насекомым, чем будет поддерживать беседу."),("th","เขายอมเป็นแมลงสักตัว ดีกว่าต้องมาคุยกับใคร"),("tr","Diyaloğa girmektense böceğe dönüşmeyi yeğler."),("vi","Thà làm con bọ còn hơn là phải chuyện trò."),("zh-hans","他宁愿当只虫，也不愿意说话。"),("zh-Hant","他寧願變成蟲也不想商量問題。")))
