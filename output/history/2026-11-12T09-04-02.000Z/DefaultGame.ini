+TextReplacements=(Category=Game, Namespace="", Key="F11563C54BD56653F9F7289305A6BC71", NativeString="The Greatest Adventure of All Time Begins Today!", LocalizedStrings=(("ar","لتبدأ أروع مغامرة على مر العصور!\r\nسفينة $.$. روكي ترسو في جزيرة العظمتين المتقاطعتين!"),("en","Let the Greatest Adventure of All Time Begin!\r\nThe $.$. Rocky docks on Crossbones Isle!"),("de","Lasst das größte Abenteuer aller Zeiten beginnen!\r\n The $.$. Rocky legt an der Knochenkorsaren-Insel an!"),("es","¡Que comience la mejor aventura de todos los tiempos!\r\n¡The $.$. Rocky atraca en Isla Calavera!"),("es-419","¡Que comience la mejor aventura de todos los tiempos!\r\n¡The $.$. Rocky se detiene en Isla Calavera!"),("fr","L'aventure de votre vie commence !\r\nLe $.$. Rocky accoste sur l'Île aux os mêlés !"),("id","Biarkan Petualangan Terhebat Sepanjang Masa Dimulai!\r\nKapal $.$. Rocky berlabuh di Pulau Tengkorak Silang!"),("it","Che la più grande avventura di sempre abbia inizio!\r\nLa $.$. Rocky ha attraccato sull'Isola Tibie Incrociate!"),("ja","史上最大の冒険を始めよう！\r\n$.$.Rockyがクロスボーン島に上陸！"),("ko","역사상 가장 위대한 모험을 시작하세요!\r\n 크로스본 섬에 있는 에이셉 라키 부두!"),("pl","Niech rozpocznie się największa przygoda wszech czasów!\r\n$.$. Rocky dokuje na Wyspie Stosu Kości!"),("pt-BR","Que comece a Maior Aventura de Todos os Tempos!\r\nO $.$. Rocky chega na Ilha Ossos Cruzados!"),("ru","Да начнётся величайшее приключение всех времён!\r\nЯхта A$AP Rocky пришвартовывается к Острову бандитов!"),("th","ขอเริ่มการผจญภัยที่ยิ่งใหญ่ที่สุดตลอดกาล!\r\n$.$. ร็อกกี้เทียบท่าที่เกาะกะโหลกไขว้!"),("tr","TÜM ZAMANLARIN EN BÜYÜK MACERASI BAŞLASIN!\r\nThe $.$. Rocky Çarpıkkemikler Adası'na yanaşıyor!"),("vi","Cuộc Phiêu Lưu Vĩ Đại Nhất Mọi Thời Đại đã bắt đầu!\r\n$.$. Rocky cập bến ở Đảo Đầu Lâu Xương Chéo!"),("zh-Hans","让史上最伟大的冒险开始吧！\r\n$.$. Rocky在十字骨岛屿的码头靠岸了！"),("zh-Hant","讓史上最精彩的冒險開始吧！\r\n$.$. Rocky 登陸海盜骷髏島嶼！")))
