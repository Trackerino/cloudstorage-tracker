+TextReplacements=(Category=Game, Namespace="", Key="AFB27DB24CD7650CD1E3A2A41185BF39", NativeString="Allies in adventure! Jonesy meets new friends!", LocalizedStrings=(("ar","المغامرات بانتظارك! جونزي يلتقي أصدقاء جددًا!"),("en","Adventure awaits! Jonesy meets new friends!"),("de","Das Abenteuer wartet! Jonesy lernt neue Freunde kennen!"),("es","¡La aventura espera! ¡Jonesy hace nuevos amigos!"),("es-419","¡La aventura espera! ¡Jonesy hace nuevos amigos!"),("fr","L'aventure vous appelle ! Jonesy se fait de nouveaux amis !"),("id","Petualangan menunggu! Jonesy bertemu teman baru!"),("it","L'avventura attende! Jonesy incontra nuovi amici!"),("ja","アドベンチャーが待っている！ ジョンジーと新たな友の出会い！"),("ko","모험이 여러분을 기다립니다! 존시가 새로운 친구들을 만났네요!"),("pl","Przygoda czeka! Jonesy poznaje nowych przyjaciół!"),("pt-BR","A aventura chama! Jonesy faz novas amizades!"),("ru","Навстречу приключениям! Друзья!"),("th","การผจญภัยรออยู่! โจนซี่พบเพื่อนใหม่!"),("tr","Macera seni bekliyor! Jonesy yeni arkadaşlarla tanışıyor!"),("vi","Cuộc phiêu lưu đang chờ đón! Jonesy kết thêm nhiều bằng hữu!"),("zh-Hans","砥砺前行！琼斯结识了新朋友！"),("zh-Hant","準備展開冒險！瓊斯結識了新的朋友！")))
