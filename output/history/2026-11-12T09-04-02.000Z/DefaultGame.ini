+TextReplacements=(Category=Game, Namespace="FortSettingValueDiscreteSupervised", Key="PEGI_SETTING_DESCRIPTION", NativeString="Set the content rating for all devices using this account. Experiences rated higher than the selected rating will require PIN to be unlocked.\n\n<strong>PEGI 12 (age 12+)</>: Violence towards fantasy characters or non-realistic violence towards human-like characters. Sexual innuendo, mild bad language and/or gambling.\n\n<strong>PEGI 7 (age 7+)</>: Mild forms of violence and scenes that younger children may find frightening.\n\n<strong>PEGI 3 (age 3+)</>: Considered suitable for all age groups.\n\nLearn more about ratings: https://www.globalratings.com/ratings-guide-pegi", LocalizedStrings=(("ar","عيّن تصنيف المحتوى لجميع الأجهزة التي تستخدم هذا الحساب. ستتطلب التجارب المصنفة بتصنيف أعلى من التصنيف المحدد رقم تعريف شخصيًا لفتحها.\n\n<strong>PEGI 16 (16 عامًا فما فوق)</>: مناسب لمن يبلغون 16 عامًا فما فوق.\n\n<strong>PEGI 12 (12 عامًا فما فوق)</>: عنف تجاه الشخصيات الخيالية أو عنف غير واقعي تجاه الشخصيات الشبيهة بالبشر. تلميحات جنسية أو لغة بذيئة خفيفة و/أو قمار.\n\n<strong>PEGI 7 (7 أعوام فما فوق)</>: أشكال معتدلة من العنف ومشاهد قد تكون مخيفة للأطفال الأصغر سنًا.\n\n<strong>PEGI 3 (3 أعوام فما فوق)</>: يعتبر مناسبًا لجميع الفئات العمرية.\n\nتعرف على المزيد عن التصنيفات: https://www.globalratings.com/ratings-guide-pegi"),("en","Set the content rating for all devices using this account. Experiences rated higher than the selected rating will require PIN to be unlocked.\n\n<strong>PEGI 16 (age 16+)</>: Suitable for those aged 16 and above.\n\n<strong>PEGI 12 (age 12+)</>: Violence towards fantasy characters or non-realistic violence towards human-like characters. Sexual innuendo, mild bad language and/or gambling.\n\n<strong>PEGI 7 (age 7+)</>: Mild forms of violence and scenes that younger children may find frightening.\n\n<strong>PEGI 3 (age 3+)</>: Considered suitable for all age groups.\n\nLearn more about ratings: https://www.globalratings.com/ratings-guide-pegi"),("de","Lege die Inhaltseinstufung für alle Geräte fest, die diesen Account verwenden. Für Erlebnisse mit einer höheren Einstufung als die ausgewählte wird eine PIN zum Freischalten benötigt.\n\n<strong>PEGI 16 (ab 16 Jahren)</>: Geeignet für Personen ab 16 Jahren.\n\n<strong>PEGI 12 (ab 12 Jahren)</>: Gewalt gegenüber Fantasy-Charakteren oder nichtrealistische Gewalt gegenüber menschenähnlichen Charakteren, sexuelle Anspielungen, Verwendung leichter Kraftausdrücke und/oder Glücksspiel.\n\n<strong>PEGI 7 (ab 7 Jahren)</>: Leichte Formen von Gewalt und Szenen, die jüngere Kinder möglicherweise beängstigend finden.\n\n<strong>PEGI 3 (ab 3 Jahren)</>: Für alle Altersgruppen geeignet.\n\nErfahre hier mehr über die Einstufungen: https://www.globalratings.com/ratings-guide-pegi"),("es","Establece la calificación de contenido para todos los dispositivos en los que se utilice esta cuenta. Es necesario introducir la contraseña para desbloquear las experiencias con una calificación superior a la seleccionada.\n\n<strong>PEGI 16 (mayores de 16 años):</> apto para mayores de 16 años.\n\n<strong>PEGI 12 (mayores de 12 años):</> violencia hacia personajes fantásticos o violencia no realista hacia personajes humanos. Insinuaciones sexuales, lenguaje soez leve o juegos de azar.\n\n<strong>PEGI 7 (mayores de 7 años):</> violencia no detallada y no realista. Puede incluir imágenes que generen miedo de forma muy moderada en niños.\n\n<strong>PEGI 3 (mayores de 3 años):</> considerado apto para todas las edades.\n\nMás información sobre las calificaciones en https://www.globalratings.com/ratings-guide-pegi (en inglés)"),("es-419","Establece la clasificación de contenido para todos los dispositivos que usan esta cuenta. Se requerirá un PIN para desbloquear las experiencias con una clasificación más alta que la seleccionada.\n\n<strong>PEGI 16 (16 años o más)</>: Apto para mayores de 16 años.\n\n<strong>PEGI 12 (12 años o más)</>: El contenido puede incluir violencia hacia los personajes de fantasía o violencia no realista hacia los personajes humanos. Puede haber insinuaciones sexuales, lenguaje soez o apuestas.\n\n<strong>PEGI 7 (7 años o más)</>: El contenido puede incluir violencia leve y escenas que pueden atemorizar a los niños más pequeños.\n\n<strong>PEGI 3 (3 años o más)</>: El contenido se considera apto para todas las edades.\n\nMás información sobre las clasificaciones: https://www.globalratings.com/ratings-guide-pegi"),("fr","Définissez la classification du contenu pour tous les appareils associés à ce compte. Les expériences dont la classification est supérieure à celle sélectionnée nécessiteront un code PIN pour être déverrouillées.\n\n<strong>PEGI 16 (16 ans et plus)</> : convient aux personnes de 16 ans et plus.\n\n<strong>PEGI 12 (12 ans et plus)</> : violence envers des personnages imaginaires ou violence non réaliste envers des personnages à figure humaine. Allusions sexuelles, langage grossier modéré et/ou jeux de hasard.\n\n<strong>PEGI 7 (7 ans et plus)</> : formes de violence modérées et scènes susceptibles d'effrayer les jeunes enfants.\n\n<strong>PEGI 3 (3 ans et plus)</> : convient à tous les groupes d'âge.\n\nEn savoir plus sur les classifications : https://www.globalratings.com/ratings-guide-pegi"),("id","Atur rating konten untuk semua perangkat yang menggunakan akun ini. Experiences dengan rating yang lebih tinggi dari rating yang dipilih akan memerlukan PIN untuk dibuka.\n\n<strong>PEGI 16 (usia 16+)</>: Cocok untuk mereka yang berusia 16 tahun ke atas.\n\n<strong>PEGI 12 (usia 12+)</>: Kekerasan terhadap karakter fantasi atau kekerasan tidak realistis terhadap karakter mirip manusia. Isyarat seksual, bahasa kasar ringan, dan/atau perjudian.\n\n<strong>PEGI 7 (usia 7+)</>: Bentuk kekerasan ringan dan adegan yang mungkin menakutkan bagi anak-anak yang lebih muda.\n\n<strong>PEGI 3 (usia 3+)</>: Dianggap cocok untuk semua kelompok usia.\n\nKetahui lebih lanjut tentang rating: https://www.globalratings.com/ratings-guide-pegi"),("it","Imposta la classificazione dei contenuti per tutti i dispositivi che usano questo account. Per sbloccare le esperienze con una classificazione più alta di quella selezionata sarà necessario un PIN.\n\n<strong>PEGI 16 (dai 16 anni in su)</>: adatto a chi ha dai 16 anni in su.\n\n<strong>PEGI 12 (dai 12 anni in su)</>: violenza contro personaggi di fantasia o violenza non realistica contro personaggi dalle sembianze umane. Allusioni sessuali, turpiloquio moderato e/o gioco d'azzardo.\n\n<strong>PEGI 7 (dai 7 anni in su)</>: forme di violenza moderate e scene che i bambini più piccoli potrebbero trovare spaventose.\n\n<strong>PEGI 3 (dai 3 anni in su)</>: considerato adatto a tutte le età.\n\nScopri di più sulle classificazioni: https://www.globalratings.com/ratings-guide-pegi"),("ja","このアカウントを使用する全デバイスにおけるコンテンツの年齢評価を設定します。選択した年齢評価よりも上の年齢評価が付けられた体験は、暗証番号によるロックの解除が必要になります。\n\n<strong>PEGI 16 (16歳以上向け)</>: 16歳以上の方に適しています。\n\n<strong>PEGI 12 (12歳以上向け)</>: 空想的なキャラクターに対する暴力、または人間に似たキャラクターに対する非現実的な暴力。性的ほのめかし、軽度の下品な言葉づかい、および/またはギャンブル。\n\n<strong>PEGI 7 (7歳以上向け)</>: 軽度の暴力や、幼い子どもが怖いと感じるシーン。\n\n<strong>PEGI 3 (3歳以上向け)</>: 全ての年齢層に適していると判断されています。\n\n年齢評価の詳細はこちら: https://www.globalratings.com/ratings-guide-pegi"),("ko","이 계정을 사용하는 모든 장치의 콘텐츠 이용등급을 설정합니다. 선택한 이용등급보다 높은 경험은 PIN이 있어야 잠금 해제할 수 있습니다.\n\n<strong>PEGI 16(만 16세 이상)</>: 만 16세 이상에게 적합합니다.\n\n<strong>PEGI 12(만 12세 이상)</>: 판타지 캐릭터를 향한 폭력이나 인간형 캐릭터를 향한 비현실적인 폭력. 성적인 풍자, 경미한 저속어, 도박.\n\n<strong>PEGI 7(만 7세 이상)</>: 경미한 폭력과 어린 자녀가 공포감을 느낄 수 있는 장면.\n\n<strong>PEGI 3(만 3세 이상)</>: 모든 연령에 적합.\n\n이용등급 자세히 보기: https://www.globalratings.com/ratings-guide-pegi"),("pl","Ustaw klasyfikację treści dla wszystkich urządzeń używających tego konta. Przygody mające klasyfikację wyższą niż wybrana, będą wymagać PIN-u do odblokowania.\n\n<strong>PEGI 16 (wiek 16+)</>: Odpowiednie dla osób w wieku 16 lat i starszych.\n\n<strong>PEGI 12 (wiek 12+)</>: Przemoc wobec postaci fantastycznych lub nierealistyczna przemoc wobec postaci o ludzkim wyglądzie. Odwołania do seksu, łagodne wulgaryzmy i/lub hazard.\n\n<strong>PEGI 7 (wiek 7+)</>: Łagodne formy przemocy i sceny mogące przerazić młodsze dzieci.\n\n<strong>PEGI 3 (wiek 3+)</>: Odpowiednie dla wszystkich grup wiekowych.\n\nWięcej informacji o klasyfikacjach: https://www.globalratings.com/ratings-guide-pegi"),("pt-BR","Defina a classificação de conteúdo para todos os dispositivos usando esta conta. Experiências com classificação de conteúdo acima da classificação selecionada exigirão PIN para desbloqueio.\n\n<strong>PEGI 16 (idade 16+)</>: Apropriado para pessoas de 16 anos ou mais.\n\n<strong>PEGI 12 (idade 12+)</>: Violência contra personagens de fantasia ou violência não realista contra personagens semelhantes a humanos. Insinuações sexuais, linguagem vulgar leve e/ou apostas.\n\n<strong>PEGI 7 (idade 7+)</>: Formas leves de violência e cenas que crianças pequenas podem achar assustadoras.\n\n<strong>PEGI 3 (idade 3+)</>: Considerado apropriado para todos os grupos etários.\n\nSaiba mais sobre as classificações: https://www.globalratings.com/ratings-guide-pegi"),("ru","Выберите возрастное ограничение для контента, которое будет действовать на всех устройствах, использующих эту учётную запись. Чтобы разблокировать острова, рейтинг которых выходит за рамки ограничений, понадобится ввести PIN-код.\n\n<strong>PEGI 16 (для детей от 16 лет)</>: подходит для лиц в возрасте от 16 лет и старше.\n\n<strong>PEGI 12 (для детей от 12 лет)</>: насилие по отношению к фантастическим персонажам или нереалистичное насилие по отношению к человекоподобным персонажам. Допускаются фразы с сексуальным подтекстом, лёгкие бранные выражения и/или изображение азартных игр.\n\n<strong>PEGI 7 (для детей от 7 лет)</>: минимальное изображение насилия и сцен, которые могут напугать детей младшего возраста.\n\n<strong>PEGI 3 (для детей от 3 лет)</>: подходит для игроков всех возрастов.\n\nПодробнее о возрастных рейтингах: https://www.globalratings.com/ratings-guide-pegi"),("th","ตั้งค่าการจัดเรตเนื้อหาให้กับอุปกรณ์ทั้งหมดที่ใช้บัญชีนี้ ประสบการณ์ที่ได้รับการจัดเรตสูงกว่าการจัดเรตที่เลือกไว้ด้องใช้รหัส PIN เพื่อปลดล็อก\n\n<strong>PEGI 16 (อายุ 16 ปีขึ้นไป)</>: เหมาะสำหรับผู้ที่มีอายุ 16 ปีขึ้นไป\n\n<strong>PEGI 12 (อายุ 12 ปีขึ้นไป)</>: มีเนื้อหาที่แสดงความรุนแรงต่อตัวละครแฟนตาซีหรือความรุนแรงที่ไม่สมจริงต่อตัวละครที่มีลักษณะคล้ายมนุษย์ มีคำพูดสองแง่สองง่าม มีการใช้ภาษาหยาบคายเล็กน้อย และ/หรือมีการพนัน\n\n<strong>PEGI 7 (อายุ 7 ปีขึ้นไป)</>: มีความรุนแรงเล็กน้อยและฉากที่เด็กเล็กอาจพบว่าน่ากลัว\n\n<strong>PEGI 3 (อายุ 3 ปีขึ้นไป)</>: ถือว่าเหมาะสมกับผู้ชมทุกช่วงวัย\n\nดูข้อมูลเพิ่มเติมเกี่ยวกับการจัดเรตได้ที่: https://www.globalratings.com/ratings-guide-pegi"),("tr","Bu hesabı kullanan tüm cihazlar için içerik derecelendirmesini belirle. Seçili derecelendirmeden daha yüksek bir derecelendirmeye sahip deneyimlerin açılması için PIN kodu gerekir.\n\n<strong>PEGI 16 (16 yaş ve üstü)</>: 16 yaş ve üzeri için uygundur.\n\n<strong>PEGI 12 (12 yaş ve üstü)</>: Fantastik karakterlere karşı şiddet veya insan benzeri karakterlere karşı gerçekçi olmayan şiddet. Cinsel göndermeler, hafif argo ve/veya kumar öğeleri.\n\n<strong>PEGI 7 (7 yaş ve üstü)</>: Hafif şiddet öğeleri ve küçük çocukların korkutucu bulabileceği sahneler.\n\n<strong>PEGI 3 (3 yaş ve üstü)</>: Tüm yaş grupları için uygundur.\n\nDerecelendirmeler hakkında daha fazla bilgi için: https://www.globalratings.com/ratings-guide-pegi"),("vi","Thiết lập phân loại nội dung cho tất cả thiết bị sử dụng tài khoản này. Những trải nghiệm có mức phân loại cao hơn phân loại đã chọn sẽ yêu cầu mã PIN để mở khóa.\n\n<strong>PEGI 16 (16 tuổi trở lên)</>: Phù hợp cho những người từ 16 tuổi trở lên.\n\n<strong>PEGI 12 (12 tuổi trở lên)</>: Bạo lực với các nhân vật viễn tưởng hoặc bạo lực phi thực tế với các nhân vật giống người. Hàm ý tình dục, một số ngôn ngữ xúc phạm và/hoặc cờ bạc.\n\n<strong>PEGI 7 (7 tuổi trở lên)</>: Bạo lực trung bình và những cảnh trẻ nhỏ có thể thấy sợ.\n\n<strong>PEGI 3 (3 tuổi trở lên)</>: Phù hợp cho mọi nhóm tuổi.\n\nTìm hiểu thêm về mức phân loại: https://www.globalratings.com/ratings-guide-pegi"),("zh-Hans","为使用该账户的所有设备设置内容评级。高于所选评级的体验需要PIN码才可解锁。\n\n<strong>PEGI 16（16 岁以上）</>：适合 16 岁及以上用户。\n\n<strong>PEGI 12（12 岁以上）</>：针对虚构角色的暴力或针对类人角色的不逼真的暴力。性暗示、轻度粗俗用语和/或赌博。\n\n<strong>PEGI 7（7 岁以上）</>：轻微的暴力和可能会让年幼儿童感到害怕的场景。\n\n<strong>PEGI 3（3 岁以上）</>：适合所有年龄段。\n\n了解更多评级信息：https://www.globalratings.com/ratings-guide-pegi"),("zh-Hant","設定此帳號在所有裝置上使用的內容分級。高於所選分級的體驗將需要 PIN 碼才能解鎖。\n\n<strong>PEGI 16（16 歲以上）</>：適合 16 歲以上玩家。\n\n<strong>PEGI 12（12 歲以上）</>：對奇幻角色的暴力或對擬人角色的非寫實暴力。性暗示、輕度不良語言及/或賭博。\n\n<strong>PEGI 7（7 歲以上）</>：輕度暴力形式和可能讓年幼兒童感到害怕的場景。\n\n<strong>PEGI 3（3 歲以上）</>：被認為適合所有年齡群組。\n\n了解更多關於分級：https://www.globalratings.com/ratings-guide-pegi"))) 
